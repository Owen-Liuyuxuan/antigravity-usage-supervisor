[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-usage-supervisor"
version = "0.1.0"
description = "A privacy-focused Ubuntu desktop top-panel addon for supervising Google Antigravity usage and Google AI Pro limits."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Owen"}]
dependencies = []

[project.scripts]
antigravity-usage-supervisor = "antigravity_usage_supervisor.preferences:main"
antigravity-usage-supervisor-service = "antigravity_usage_supervisor.service:main"
antigravity-usage-supervisor-preferences = "antigravity_usage_supervisor.preferences:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
